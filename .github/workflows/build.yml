name: Build VANTA Game Tools APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VANTA-Game-Tools-V1.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract VANTA project
        shell: bash
        run: |
          test -f VANTA-Game-Tools-V1.zip || (echo "VANTA-Game-Tools-V1.zip not found in repository root" && exit 1)
          rm -rf vanta-build
          mkdir -p vanta-build
          unzip -q VANTA-Game-Tools-V1.zip -d vanta-build
          echo "Project files:"
          find vanta-build -maxdepth 2 -type f | sort | head -80

      - name: Build APK
        working-directory: vanta-build
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          APK="vanta-build/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || (echo "APK was not generated" && exit 1)
          cp "$APK" VANTA-Game-Tools-V1-debug.apk
          ls -lh VANTA-Game-Tools-V1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Game-Tools-V1-debug
          path: VANTA-Game-Tools-V1-debug.apk
          if-no-files-found: error
          retention-days: 14
